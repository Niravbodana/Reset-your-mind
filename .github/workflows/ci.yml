name: CI

on:
  push:
    paths:
      - "saathly/**"
  pull_request:
    paths:
      - "saathly/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saathly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: saathly/package-lock.json
      - run: npm ci
      - run: npm run build
